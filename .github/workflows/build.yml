name: Build

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            suffix: ""
          - arch: arm64
            suffix: "-arm64"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Zig 0.13.0
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://ziglang.org/download/0.13.0/zig-windows-x86_64-0.13.0.zip'
          $zip = Join-Path $env:RUNNER_TEMP 'zig.zip'
          $dir = Join-Path $env:RUNNER_TEMP 'zig'
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dir
          $zig = Get-ChildItem $dir -Filter zig.exe -Recurse | Select-Object -First 1 -ExpandProperty FullName
          if (-not $zig) { throw 'zig.exe was not found after extraction.' }
          "ZIG_EXE=$zig" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install NSIS 3
        shell: pwsh
        run: choco install nsis --yes --no-progress

      - name: Build application and installer
        shell: cmd
        run: |
          call build-portable${{ matrix.suffix }}.cmd nopause
          if errorlevel 1 exit /b 1
          call build-installer${{ matrix.suffix }}.cmd nopause

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KingPanel-Windows-${{ matrix.arch }}
          if-no-files-found: error
          path: dist/KingPanel*.exe
