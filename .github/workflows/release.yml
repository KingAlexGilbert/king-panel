name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify tag matches source version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tagVersion = $env:GITHUB_REF_NAME -replace '^v', ''
          $setup = Get-Content -Raw setup.nsi
          $match = [regex]::Match($setup, 'VIAddVersionKey\s+/LANG=1033\s+"FileVersion"\s+"([^"]+)"')
          if (-not $match.Success) { throw 'Could not read FileVersion from setup.nsi.' }
          $sourceVersion = $match.Groups[1].Value
          if ($tagVersion -ne $sourceVersion) {
            throw "Tag version $tagVersion does not match setup.nsi version $sourceVersion."
          }

      - name: Install Zig 0.13.0
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://ziglang.org/download/0.13.0/zig-windows-x86_64-0.13.0.zip'
          $zip = Join-Path $env:RUNNER_TEMP 'zig.zip'
          $dir = Join-Path $env:RUNNER_TEMP 'zig'
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dir
          $zig = Get-ChildItem $dir -Filter zig.exe -Recurse | Select-Object -First 1 -ExpandProperty FullName
          if (-not $zig) { throw 'zig.exe was not found after extraction.' }
          "ZIG_EXE=$zig" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install NSIS 3
        shell: pwsh
        run: choco install nsis --yes --no-progress

      - name: Build release binaries
        shell: cmd
        run: |
          call build-portable.cmd nopause
          if errorlevel 1 exit /b 1
          call build-installer.cmd nopause

      - name: Create SHA-256 checksums
        shell: pwsh
        run: |
          $files = @('dist/KingPanel.exe') + @(Get-ChildItem 'dist/KingPanel-Setup-*.exe' | ForEach-Object FullName)
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $(Split-Path $file -Leaf)"
          }
          $lines | Set-Content -Encoding ascii dist/SHA256SUMS.txt

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "King Panel $tag" --generate-notes
          }
          $installer = Get-ChildItem 'dist/KingPanel-Setup-*.exe' | Select-Object -First 1 -ExpandProperty FullName
          gh release upload $tag dist/KingPanel.exe $installer dist/SHA256SUMS.txt --clobber
